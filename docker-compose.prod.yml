# 生产环境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: atp_postgres
    environment:
      POSTGRES_DB: atp_db
      POSTGRES_USER: atp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atp_password}  # 生产环境应使用环境变量
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U atp_user -d atp_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atp_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: atp_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - atp_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atp_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=atp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-atp_password}
      - POSTGRES_DB=atp_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atp_network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atp_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/atp_repos:/tmp/atp_repos
      - /tmp/atp_runs:/tmp/atp_runs
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=atp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-atp_password}
      - POSTGRES_DB=atp_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atp_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  atp_network:
    driver: bridge
