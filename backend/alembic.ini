# Alembic 配置文件

[alembic]
# 迁移脚本存放路径
script_location = alembic

# 模板文件路径
# file_template = %%(rev)s_%%(slug)s

# 时区设置 (如 YYYY-MM-DD HH:MM:SS)
# timezone =

# 日志输出最大长度
# truncate_slug_length = 40

# 数据库连接字符串
# 注意: 这里使用同步驱动 (postgresql://)，因为 Alembic 需要同步连接
# 实际值从环境变量读取或在 env.py 中动态设置
sqlalchemy.url = postgresql://atp_user:atp_password@localhost:5432/atp_db


# 日志配置
# ============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
